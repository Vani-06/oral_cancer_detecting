# Builds both images in Google Cloud and pushes them to Artifact Registry.
# Run by deploy/gcp/deploy.sh; substitutions are filled in there.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/api.Dockerfile", "-t", "${_REGISTRY}/api:${_TAG}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/web.Dockerfile", "--build-arg", "VITE_API_BASE_URL=${_API_URL}",
           "-t", "${_REGISTRY}/web:${_TAG}", "."]
images:
  - "${_REGISTRY}/api:${_TAG}"
  - "${_REGISTRY}/web:${_TAG}"
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
